name: Build OneTGMod APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Install Native Build Tools & NDK 21 Compatibility Libs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yasm nasm ninja-build cmake build-essential pkg-config libncurses6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            yes | "$SDK_MGR" "ndk;21.4.7075529" "cmake;3.10.2.4988404" >/dev/null 2>&1 || true
          fi

      - name: Build Native Dependencies (BoringSSL, FFmpeg, libvpx)
        run: |
          export NDK="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export NINJA_PATH="$(command -v ninja)"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd TMessagesProj/jni
          chmod +x *.sh
          [ -f patch_boringssl.sh ] && ./patch_boringssl.sh
          [ -f build_boringssl.sh ] && ./build_boringssl.sh
          [ -f patch_ffmpeg.sh ] && ./patch_ffmpeg.sh
          if [ -f build_ffmpeg_clang.sh ]; then
            ./build_ffmpeg_clang.sh || { tail -n 50 ffmpeg/ffbuild/config.log 2>/dev/null || true; exit 1; }
          fi
          [ -f build_libvpx_clang.sh ] && ./build_libvpx_clang.sh
          ls -lh ffmpeg/build/arm64-v8a/lib/libswscale.a

      - name: Prepare API_KEYS and Release Keystore
        run: |
          printf "APP_ID=34710776\nAPP_HASH=95246192dbd8a64e3a6242a00119b547\n" > API_KEYS
          cp API_KEYS TMessagesProj/API_KEYS
          cp API_KEYS TMessagesProj_App/API_KEYS
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=OneTGMod, OU=Mod, O=OneTG, L=UA, S=UA, C=UA"
          cp TMessagesProj/config/release.keystore release.keystore
          cp TMessagesProj/config/release.keystore TMessagesProj_App/release.keystore
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Build OneTGMod APK
        run: |
          export NDK="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$NDK"
          chmod +x gradlew
          ALL_TASKS=$(./gradlew :TMessagesProj_App:tasks --all | grep -oE 'TMessagesProj_App:assemble[A-Za-z0-9_]*Release' | sort -u || true)
          echo "Available release tasks:"
          echo "$ALL_TASKS"
          TASK=""
          for CAND in \
            "TMessagesProj_App:assembleArm64FossRelease" \
            "TMessagesProj_App:assembleArm64Release" \
            "TMessagesProj_App:assembleAfatFossRelease" \
            "TMessagesProj_App:assembleAfatRelease" \
            "TMessagesProj_App:assembleFossRelease" \
            "TMessagesProj_App:assembleRelease"; do
            if echo "$ALL_TASKS" | grep -qx "$CAND"; then
              TASK=":$CAND"
              break
            fi
          done
          if [ -z "$TASK" ]; then
            FIRST=$(echo "$ALL_TASKS" | head -n 1)
            [ -n "$FIRST" ] && TASK=":$FIRST" || TASK=":TMessagesProj_App:assembleRelease"
          fi
          echo "Selected Gradle task: $TASK"
          ./gradlew "$TASK" --stacktrace \
            -PRELEASE_STORE_FILE=config/release.keystore \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=android \
            -PRELEASE_KEY_PASSWORD=android

      - name: Collect APK
        run: |
          mkdir -p out_apk
          find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} out_apk/OneTGMod.apk \;
          ls -lh out_apk/

      - name: Upload OneTGMod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneTGMod-apk
          path: out_apk/OneTGMod.apk
