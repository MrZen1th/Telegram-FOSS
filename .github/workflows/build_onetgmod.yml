name: Build OneTGMod APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  APP_ID: "34710776"
  APP_HASH: "95246192dbd8a64e3a6242a00119b547"
  TELEGRAM_APP_ID: "34710776"
  TELEGRAM_APP_HASH: "95246192dbd8a64e3a6242a00119b547"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            if [ -n "21.4.7075529" ]; then
              echo "Installing NDK 21.4.7075529..."
              yes | "$SDK_MGR" "ndk;21.4.7075529" >/dev/null 2>&1 || true
            fi
          fi

      - name: Generate Release Keystore and local.properties
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias android             -keyalg RSA -keysize 2048 -validity 10000             -storepass android -keypass android             -dname "CN=OneTGMod, OU=Mod, O=OneTG, L=UA, S=UA, C=UA"
          cp TMessagesProj/config/release.keystore release.keystore
          cp TMessagesProj/config/release.keystore TMessagesProj_App/release.keystore
          printf "sdk.dir=%s\nAPP_ID=34710776\nAPP_HASH=95246192dbd8a64e3a6242a00119b547\n" "$ANDROID_HOME" > local.properties

      - name: Build OneTGMod APK
        run: |
          chmod +x gradlew
          ALL_TASKS=$(./gradlew :TMessagesProj_App:tasks --all | grep -oE 'TMessagesProj_App:assemble[A-Za-z0-9_]*Release' | sort -u || true)
          echo "Available release tasks:"
          echo "$ALL_TASKS"
          TASK=""
          for CAND in             "TMessagesProj_App:assembleAfatFossRelease"             "TMessagesProj_App:assembleAfatRelease"             "TMessagesProj_App:assembleFossRelease"             "TMessagesProj_App:assembleArm64Release"             "TMessagesProj_App:assembleRelease"; do
            if echo "$ALL_TASKS" | grep -qx "$CAND"; then
              TASK=":$CAND"
              break
            fi
          done
          if [ -z "$TASK" ]; then
            FIRST=$(echo "$ALL_TASKS" | head -n 1)
            [ -n "$FIRST" ] && TASK=":$FIRST" || TASK=":TMessagesProj_App:assembleRelease"
          fi
          echo "Selected Gradle task: $TASK"
          ./gradlew "$TASK" --stacktrace             -PAPP_ID=34710776             -PAPP_HASH=95246192dbd8a64e3a6242a00119b547             -PRELEASE_STORE_FILE=config/release.keystore             -PRELEASE_STORE_PASSWORD=android             -PRELEASE_KEY_ALIAS=android             -PRELEASE_KEY_PASSWORD=android

      - name: Collect APK
        run: |
          mkdir -p out_apk
          find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} out_apk/OneTGMod.apk \;
          ls -lh out_apk/

      - name: Upload OneTGMod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneTGMod-apk
          path: out_apk/OneTGMod.apk
